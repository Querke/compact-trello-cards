<!doctype html>
<html>
  <head>
    <style>
      body {
        font-family: sans-serif;
        min-width: 180px;
        background: #f5f5f5;
      }

      label {
        display: flex;
        align-items: center;
        padding: 2px;
      }

      h3 {
        padding: 2px;
      }

      .mode-option {
        padding: 6px 12px;
        margin: 4px 0;
        border-radius: 6px;
        border: 1px solid #ccc;
        background-color: #fff;
        cursor: pointer;
      }

      .mode-option.selected {
        background-color: #0079bf;
        color: white;
        border-color: #0079bf;
      }
    </style>
  </head>
  <body>
    <h3>Trello Compact Cards</h3>
    <!-- <label>
      <span style="margin-right: 8px">Mode:</span>
      <select
        id="mode-select"
        style="width: 100%; border-radius: 6px; padding: 4px"
      >
        <option value="none">None</option>
        <option value="compact">Compact</option>
        <option value="tiny">Tiny</option>
      </select>
    </label> -->
    <label>Mode:</label>
    <div id="mode-options">
      <div class="mode-option" data-mode="none">None</div>
      <div class="mode-option" data-mode="compact">Compact</div>
      <div class="mode-option" data-mode="tiny">Tiny</div>
    </div>

    <label style="margin-top: 12px; display: flex; justify-content: space-between">
      <span>List Width:</span>
      <input type="text" id="width-value" style="width: 50px; text-align: right; padding: 2px; border: 1px solid #ccc; border-radius: 4px" placeholder="Auto" />
    </label>
    <div style="padding: 0 4px">
      <input type="range" id="width-slider" min="1" max="6" step="1" style="width: 100%; margin-bottom: 0" />
      <div style="display: flex; justify-content: space-between; font-size: 10px; color: #666; margin-top: -4px">
        <span>Very Narrow</span>
        <span>Auto</span>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
